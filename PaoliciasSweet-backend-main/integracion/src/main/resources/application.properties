server.port=9000
spring.application.name=api-gateway

# Configuración para el microservicio de usuarios
spring.cloud.gateway.routes[0].id=ms-usuarios
# Asumiendo que levantaremos usuarios en el puerto 8081:
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**

# Configuración para el microservicio de reservas
spring.cloud.gateway.routes[1].id=ms-reservas
# Asumiendo que levantaremos reservas en el puerto 8082:
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/reservas/**