spring.application.name=reservas

#Puerto 8082 para que no choque con el 8081 de Usuarios
server.port=8082

# Conexión a una nueva base de datos exclusiva para reservas
spring.datasource.url=jdbc:mysql://localhost:3306/bd_reservas?useSSL=false&serverTimezone=UTC

# Credenciales de MySQL
spring.datasource.username=root
spring.datasource.password=

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true