spring.application.name=usuarios

# puerto 8081 para despues usar el kotlin
server.port=8081

# la conexión a la base de datos "bd_usuarios"
spring.datasource.url=jdbc:mysql://localhost:3306/bd_usuarios?useSSL=false&serverTimezone=UTC

# Credenciales
spring.datasource.username=root
spring.datasource.password=

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (JPA) para crear la tabla
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true